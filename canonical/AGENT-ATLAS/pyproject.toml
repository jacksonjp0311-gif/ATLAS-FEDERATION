[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"
[project]
name="agent-atlas-research"
version="1.0.0"
requires-python=">=3.10"
description="Evidence-preserving Agent Atlas with bounded offline planning, audit and evaluation models"
[tool.setuptools.packages.find]
where=["."]
include=["agent_atlas*"]
[tool.setuptools.package-data]
agent_atlas=["resources/common/*.json","resources/common/nodes/*/*.json","resources/common/nodes/*/data/*.jsonl"]
