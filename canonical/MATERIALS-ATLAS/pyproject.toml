[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="materials-atlas"
version="1.0.0"
requires-python=">=3.10"
description="Bounded materials science reference, source-led research and explicitly scoped numerical calculators"
[tool.setuptools.packages.find]
where=["."]
include=["materials_atlas*"]
[tool.setuptools.package-data]
materials_atlas=["resources/hahn1/*.tsv","resources/hahn1/*.json","resources/common/*.json","resources/common/nodes/*/*.json","resources/common/nodes/*/data/*.jsonl"]
