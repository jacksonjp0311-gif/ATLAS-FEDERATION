[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-software-design-patterns"
version = "0.1.0"
requires-python = ">=3.10"
description = "Original ATLAS FORGE offline software patterns, durable journal and deterministic recovery"

[tool.setuptools.packages.find]
where = ["."]
include = ["patterns_atlas*"]

[tool.setuptools.package-data]
patterns_atlas = ["resources/common/*.json", "resources/common/nodes/*/*.json", "resources/common/nodes/*/data/*.jsonl"]
